{% extends "base.html" %}
{% block title %}Create Account - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="auth-container animate-scale-in">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-icon"></i>
            <h1>Create Account</h1>
            <p>Join thousands taking control of their money with AI</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Choose a username" required autocomplete="username" autofocus>
            </div>
            
            <div class="input-group">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Create a strong password" required id="password" autocomplete="new-password">
                <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fas fa-sparkles"></i> Get Started
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
        </div>
        
        <!-- Ambient Glowing Orbs -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword() {
    const password = document.getElementById('password');
    const icon = document.querySelector('.toggle-password');
    if (password.type === 'password') {
        password.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        password.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
