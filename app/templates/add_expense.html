{% extends "base.html" %}
{% block title %}Add New Expense - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="form-container animate-fade-up">
    <div class="form-card glass">
        <div class="form-header">
            <i class="fas fa-circle-plus"></i>
            <h2>Record New Expense</h2>
            <p>Enter your spending details to keep your budget on track</p>
        </div>
        
        <form method="POST" class="expense-form">
            <div class="form-row">
                <div class="input-group">
                    <label for="amount"><i class="fas fa-coins"></i> Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" id="amount" placeholder="0.00" required autofocus>
                </div>
                
                <div class="input-group">
                    <label for="category"><i class="fas fa-tag"></i> Category</label>
                    <select name="category" id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food & Dining</option>
                        <option value="Transport">🚗 Transportation & Fuel</option>
                        <option value="Rent">🏠 Rent & Bills</option>
                        <option value="Entertainment">🎮 Entertainment & Movies</option>
                        <option value="Shopping">🛍️ Shopping & Apparel</option>
                        <option value="Healthcare">💊 Medical & Health</option>
                        <option value="Education">📚 Books & Courses</option>
                        <option value="Other">📦 Miscellaneous</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label for="date"><i class="fas fa-calendar-days"></i> Date</label>
                    <input type="date" name="date" id="date" required>
                </div>
                
                <div class="input-group">
                    <label for="note"><i class="fas fa-pen-to-square"></i> Description / Note</label>
                    <input type="text" name="note" id="note" placeholder="e.g. Grocery store, Uber ride...">
                </div>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('main.dashboard') }}" class="btn-secondary">
                    <i class="fas fa-xmark"></i> Cancel
                </a>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-check"></i> Save Expense
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
