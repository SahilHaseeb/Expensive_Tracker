{% extends "base.html" %}
{% block title %}Login - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="auth-container animate-scale-in">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-wallet auth-icon"></i>
            <h1>Welcome Back</h1>
            <p>Log in to manage and optimize your personal finances</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="input-group">
                <i class="fas fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" required autocomplete="username" autofocus>
            </div>
            
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" name="password" placeholder="Password" required id="password" autocomplete="current-password">
                <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
            </div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">
                <i class="fas fa-arrow-right-to-bracket"></i> Sign In
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
        </div>
        
        <!-- Ambient Glowing Orbs -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword() {
    const password = document.getElementById('password');
    const icon = document.querySelector('.toggle-password');
    if (password.type === 'password') {
        password.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
    } else {
        password.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
    }
}
</script>
{% endblock %}
