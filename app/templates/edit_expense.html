{% extends "base.html" %}
{% block content %}
<h2>Edit Expense</h2>
<form method="POST">
    <input type="number" step="0.01" name="amount" value="{{ expense.amount }}" required class="form-control mb-2">
    <select name="category" class="form-control mb-2">
        {% for cat in ['Food','Transport','Rent','Entertainment','Shopping','Other'] %}
            <option {% if expense.category == cat %}selected{% endif %}>{{ cat }}</option>
        {% endfor %}
    </select>
    <input type="date" name="date" value="{{ expense.date }}" required class="form-control mb-2">
    <input type="text" name="note" value="{{ expense.note or '' }}" class="form-control mb-2">
    <button type="submit" class="btn btn-success">Update</button>
</form>
{% endblock %}
