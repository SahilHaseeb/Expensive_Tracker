{% extends "base.html" %}
{% block title %}Edit Expense - Smart Expense Tracker{% endblock %}

{% block content %}
<div class="form-container animate-fade-up">
    <div class="form-card glass">
        <div class="form-header">
            <i class="fas fa-pen-to-square"></i>
            <h2>Edit Expense</h2>
            <p>Update your transaction details</p>
        </div>
        
        <form method="POST" class="expense-form">
            <div class="form-row">
                <div class="input-group">
                    <label for="amount"><i class="fas fa-coins"></i> Amount (₹)</label>
                    <input type="number" step="0.01" name="amount" id="amount" value="{{ expense.amount }}" required>
                </div>
                
                <div class="input-group">
                    <label for="category"><i class="fas fa-tag"></i> Category</label>
                    <select name="category" id="category" required>
                        <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>🍔 Food & Dining</option>
                        <option value="Transport" {% if expense.category == 'Transport' %}selected{% endif %}>🚗 Transportation & Fuel</option>
                        <option value="Rent" {% if expense.category == 'Rent' %}selected{% endif %}>🏠 Rent & Bills</option>
                        <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>🎮 Entertainment & Movies</option>
                        <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>🛍️ Shopping & Apparel</option>
                        <option value="Healthcare" {% if expense.category == 'Healthcare' %}selected{% endif %}>💊 Medical & Health</option>
                        <option value="Education" {% if expense.category == 'Education' %}selected{% endif %}>📚 Books & Courses</option>
                        <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>📦 Miscellaneous</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="input-group">
                    <label for="date"><i class="fas fa-calendar-days"></i> Date</label>
                    <input type="date" name="date" id="date" value="{{ expense.date }}" required>
                </div>
                
                <div class="input-group">
                    <label for="note"><i class="fas fa-pen-to-square"></i> Description / Note</label>
                    <input type="text" name="note" id="note" value="{{ expense.note or '' }}" placeholder="Optional note">
                </div>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('main.dashboard') }}" class="btn-secondary">
                    <i class="fas fa-xmark"></i> Cancel
                </a>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-floppy-disk"></i> Update Expense
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
